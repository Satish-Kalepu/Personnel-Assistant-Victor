services:
  api:
    environment:
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    depends_on:
      mailpit: { condition: service_started }
  mailpit:
    image: axllent/mailpit:v1.29.2
    ports: ["127.0.0.1:8025:8025"]
    networks: [edge]
    mem_limit: 128m
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /data/mailpit.db
    volumes: [mailpit-data:/data]
volumes:
  mailpit-data:
