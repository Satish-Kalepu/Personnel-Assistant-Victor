# HISTORICAL: superseded by container Nginx + mounted frontend. Do not activate.
# PROPOSED host-only serving. Not active until assets/API are prepared.
# Paste/merge INSIDE the existing HTTPS server_name ai_test.satishk.com block.
# Preserve listen/server_name/certificate directives and all unrelated sites.
# Replace old location / and location = /voice, and merge matching directives
# below without creating duplicate root/index/header/location directives.
root /srv/victor-web/current;
index index.html;
client_max_body_size 32k;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy 'microphone=(self), camera=(), geolocation=()' always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header Cache-Control no-store always;

location = /health {
    proxy_pass http://127.0.0.1:18081/health/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
}

location /api/ {
    # No trailing URI slash: retain the application's /api/... route prefix.
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
}

location = /voice {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 360s;
    proxy_send_timeout 30s;
    proxy_buffering off;
}

location = /voice-worklet.js { try_files $uri =404; }
location /assets/ { try_files $uri =404; }
location / { try_files $uri $uri/ /index.html; }
