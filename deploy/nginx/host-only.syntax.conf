# Unprivileged syntax harness only; never install this as the host config.
# Run with -p /home/ai_assistant/victor-stage/nginx-check/ and -t.
pid nginx.pid;
error_log error.log;
events { worker_connections 32; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;
    server {
        listen 127.0.0.1:18082;
        server_name ai_test.satishk.com;
        include /home/ai_assistant/victor-stage/repository/deploy/nginx/ai_test.host-only.conf;
    }
}
