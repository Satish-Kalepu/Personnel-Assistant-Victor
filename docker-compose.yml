name: victor
# One application stack. Environment values select laptop, staging or production.
# TLS terminates at the external ALB/host Nginx; only web publishes an app port.
services:
  mongodb:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: mongo:8.2.5
    entrypoint: [bash, /boot/mongo-entry.sh]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run node deploy/scripts/init-dev.mjs or supply private server settings}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?Run node deploy/scripts/init-dev.mjs or supply private server settings}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./deploy/mongo/entry.sh:/boot/mongo-entry.sh:ro
    networks:
      - data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-setup:
    image: mongo:8.2.5
    entrypoint: [mongosh, --nodb, --quiet, /boot/setup.js]
    environment:
      MONGO_SETUP_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run node deploy/scripts/init-dev.mjs or supply private server settings}
    volumes:
      - ./deploy/mongo/setup.js:/boot/setup.js:ro
    networks:
      - data
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  redis:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:8.2.3-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run node deploy/scripts/init-dev.mjs or supply private server settings}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build: ./services/api
    image: ${API_IMAGE:-victor-api:local}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      PORT: "3000"
      MONGODB_URI: mongodb://victor:${MONGO_APP_PASSWORD}@mongodb:27017/victor?replicaSet=rs0&authSource=victor
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?Set MAIL_ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_VOICE_MODEL: ${OPENAI_VOICE_MODEL:-gpt-6-luna}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_PRIVACY_CONFIRMED: ${SARVAM_PRIVACY_CONFIRMED:-false}
      SARVAM_SPEAKER: ${SARVAM_SPEAKER:-simran_en_customer}
      VOICE_ENDPOINT_MODE: ${VOICE_ENDPOINT_MODE:-provider}
      VOICE_WORKER_URL: ws://voice-worker:4320/listen
      VOICE_GATEWAY_TOKEN: ${VOICE_GATEWAY_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      DAILY_CHAT_LIMIT: ${DAILY_CHAT_LIMIT:-20}
      DAILY_EMAIL_LIMIT: ${DAILY_EMAIL_LIMIT:-500}
      DAILY_VOICE_SECONDS: ${DAILY_VOICE_SECONDS:-300}
      MONTHLY_AI_LIMIT_CENTS: ${MONTHLY_AI_LIMIT_CENTS:-5000}
      CHAT_RESERVE_CENTS: ${CHAT_RESERVE_CENTS:-5}
      VOICE_RESERVE_CENTS_PER_MINUTE: ${VOICE_RESERVE_CENTS_PER_MINUTE:-4}
      TTS_RESERVE_CENTS_PER_1000_CHARS: ${TTS_RESERVE_CENTS_PER_1000_CHARS:-2}
    networks:
      - data
      - edge
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      voice-worker:
        condition: service_healthy
        required: false
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build: ./web
    image: ${WEB_IMAGE:-victor-web:local}
    environment:
      ALB_TRUSTED_CIDR: ${ALB_TRUSTED_CIDR:-127.0.0.1/32}
    # Keep loopback for host Nginx. For ALB, explicitly set the host's private IP.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    # Server default. On laptops set WEB_ASSET_PATH=./web/dist in .env.dev.
    volumes:
      - type: bind
        source: ${WEB_ASSET_PATH:-/srv/victor-web/current}
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Enable with --profile owned-voice when VOICE_ENDPOINT_MODE=owned.
  # The worker has no host port, database credentials or provider keys.
  voice-worker:
    profiles: [owned-voice]
    build: ./services/voice-worker
    image: ${VOICE_WORKER_IMAGE:-victor-voice-worker:local}
    restart: unless-stopped
    environment:
      VOICE_GATEWAY_TOKEN: ${VOICE_GATEWAY_TOKEN:-}
    networks:
      - data
    mem_limit: 256m
    cpus: 0.75
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Local inbox only. Never enable this profile on a public server.
  mailpit:
    profiles: [local]
    image: axllent/mailpit:v1.29.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    networks:
      - edge
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo-data:
  mongo-config:
  redis-data:
  mailpit-data:
networks:
  data:
    internal: true
  edge:
