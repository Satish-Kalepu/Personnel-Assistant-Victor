# Provisional PRIVATE stage only. Public HTTPS uses compose.prod.yml instead.
# Start with -p victor-stage, an isolated env file and reviewed image tags.
services:
  api:
    build: !reset null
    environment:
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    depends_on:
      mailpit: { condition: service_started }
  web:
    build: !reset null
    ports: !override ["127.0.0.1:${WEB_PORT:-18080}:8080"]
  mailpit:
    image: axllent/mailpit:v1.29.2
    ports: ["127.0.0.1:${STAGE_MAIL_PORT:-18025}:8025"]
    networks: [edge]
    mem_limit: 128m
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "100"
      MP_DATABASE: /data/mailpit.db
    volumes: [mailpit-data:/data]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  mailpit-data:
