name: victor
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  mongodb:
    <<: *runtime
    image: mongo:8.2.5
    entrypoint: [bash, /boot/mongo-entry.sh]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run init-dev first}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?Run init-dev first}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./deploy/mongo/entry.sh:/boot/mongo-entry.sh:ro
    networks: [data]
    mem_limit: 1g
    healthcheck:
      test:
        [
          CMD,
          mongosh,
          --quiet,
          --eval,
          "quit(db.adminCommand({ping:1}).ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-setup:
    image: mongo:8.2.5
    entrypoint: [mongosh, --nodb, --quiet, /boot/setup.js]
    environment:
      MONGO_SETUP_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run init-dev first}
    volumes: [./deploy/mongo/setup.js:/boot/setup.js:ro]
    networks: [data]
    depends_on:
      mongodb: { condition: service_healthy }
    restart: "no"
  redis:
    <<: *runtime
    image: redis:8.2.3-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run init-dev first}
    command:
      [
        sh,
        -c,
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes',
      ]
    volumes: [redis-data:/data]
    networks: [data]
    mem_limit: 192m
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *runtime
    build: ./services/api
    image: ${API_IMAGE:-victor-api:local}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      PORT: "3000"
      MONGODB_URI: mongodb://victor:${MONGO_APP_PASSWORD}@mongodb:27017/victor?replicaSet=rs0&authSource=victor
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?Set MAIL_ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_VOICE_MODEL: ${OPENAI_VOICE_MODEL:-gpt-6-luna}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_PRIVACY_CONFIRMED: ${SARVAM_PRIVACY_CONFIRMED:-false}
      SARVAM_SPEAKER: ${SARVAM_SPEAKER:-simran_en_customer}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      DAILY_CHAT_LIMIT: ${DAILY_CHAT_LIMIT:-20}
      DAILY_EMAIL_LIMIT: ${DAILY_EMAIL_LIMIT:-500}
      DAILY_VOICE_SECONDS: ${DAILY_VOICE_SECONDS:-300}
      MONTHLY_AI_LIMIT_CENTS: ${MONTHLY_AI_LIMIT_CENTS:-5000}
      CHAT_RESERVE_CENTS: ${CHAT_RESERVE_CENTS:-5}
      VOICE_RESERVE_CENTS_PER_MINUTE: ${VOICE_RESERVE_CENTS_PER_MINUTE:-4}
      TTS_RESERVE_CENTS_PER_1000_CHARS: ${TTS_RESERVE_CENTS_PER_1000_CHARS:-2}
    networks: [data, edge]
    depends_on:
      mongo-setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    <<: *runtime
    build: ./web
    image: ${WEB_IMAGE:-victor-web:local}
    environment:
      ALB_TRUSTED_CIDR: ${ALB_TRUSTED_CIDR:-127.0.0.1/32}
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  mongo-data:
  mongo-config:
  redis-data:
networks:
  data: { internal: true }
  edge:
